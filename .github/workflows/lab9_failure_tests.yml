
name: Lab 9 - Failure and Recovery Tests

on:
  workflow_dispatch:

jobs:
  failure-tests:
    runs-on: ubuntu-latest

    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      SKIP_LIVE_DEPLOYMENT: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build the normal MLOps pipeline
        run: python src/mlops_pipeline/churn_prediction_pipeline.py --force

      - name: Verify pipeline outputs
        run: |
          echo "Checking generated files..."
          find data artifacts models outputs -type f 2>/dev/null || true

      - name: Run Lab 9 failure and recovery tests
        run: python src/mlops_pipeline/10_failure_injection.py

      - name: Upload Lab 9 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab9-failure-tests-${{ github.run_number }}
          path: |
            reports/**
            artifacts/**
            logs/**
            outputs/**
            data/processed/**
            models/**
          if-no-files-found: ignore
